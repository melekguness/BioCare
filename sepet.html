<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BioCare sepeti">
  <title>Sepet | BioCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <main id="icerik">
    <div class="container bc-page-hero">
      <h1>Sepet</h1>
      <p class="bc-lead">Seçtiğin ürünleri gözden geçir, adetleri ayarla.</p>
    </div>

    <div id="app" class="bc-section pt-3">
      <div class="container">
        <div v-if="loading" class="bc-empty" role="status">Sepet yükleniyor…</div>
        <div v-else-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
        <template v-else>
          <div v-if="!rows.length" class="bc-panel text-center">
            <p class="mb-3">Sepetin şu an boş.</p>
            <a class="btn btn-bc" href="urunler.html">Ürünlere git</a>
          </div>

          <div v-else class="row g-4">
            <div class="col-lg-8">
              <div class="bc-cart-table" role="list" aria-label="Sepet ürünleri">
                <div v-for="row in rows" :key="row.id" class="bc-cart-item" role="listitem">
                  <img :src="row.product.image" :alt="row.product.name" width="72" height="72">
                  <div>
                    <a :href="'urun.html?id=' + row.id" class="fw-semibold text-decoration-none text-dark">{{ row.product.name }}</a>
                    <div class="small text-secondary">{{ money(row.product.price) }} / adet</div>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                      <div class="bc-qty" role="group" :aria-label="row.product.name + ' adet'">
                        <button type="button" @click="setQty(row.id, row.qty - 1)" aria-label="Azalt">−</button>
                        <span>{{ row.qty }}</span>
                        <button type="button" @click="setQty(row.id, row.qty + 1)" aria-label="Artır">+</button>
                      </div>
                      <button type="button" class="btn btn-link btn-sm text-danger" @click="remove(row.id)">Kaldır</button>
                    </div>
                  </div>
                  <div class="bc-cart-item__price fw-bold">{{ money(row.line) }}</div>
                </div>
              </div>
              <button type="button" class="btn btn-bc-ghost mt-3" @click="clear">Sepeti temizle</button>
            </div>

            <div class="col-lg-4">
              <aside class="bc-summary" aria-labelledby="sum-title">
                <h2 id="sum-title" class="h5 mb-3">Sipariş özeti</h2>
                <div class="d-flex justify-content-between mb-2">
                  <span>Ürün adedi</span>
                  <strong>{{ count }}</strong>
                </div>
                <div class="d-flex justify-content-between mb-3">
                  <span>Ara toplam</span>
                  <strong>{{ money(total) }}</strong>
                </div>
                <p class="small text-secondary">Kargo ve KDV demo aşamasında hesaplanmaz.</p>
                <button type="button" class="btn btn-bc w-100" @click="checkout">Siparişi tamamla</button>
                <a class="btn btn-bc-ghost w-100 mt-2" href="urunler.html">Alışverişe devam</a>
              </aside>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
