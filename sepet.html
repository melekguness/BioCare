<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Sepet | BioCare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-4 text-center text-white">
      <h1 class="display-5 fw-bolder">Sepet</h1>
      <p class="lead text-white-50 mb-0">Seçtiğin ürünleri gözden geçir</p>
    </div>
  </header>

  <main id="icerik" class="py-5">
    <div id="app" class="container px-4 px-lg-5">
      <div v-if="loading" class="text-muted">Yükleniyor…</div>
      <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
      <template v-else>
        <div v-if="!rows.length" class="card shadow-sm">
          <div class="card-body text-center py-5">
            <p class="mb-3">Sepetin boş.</p>
            <a class="btn btn-outline-dark" href="urunler.html">Alışverişe başla</a>
          </div>
        </div>

        <div v-else class="row gx-4">
          <div class="col-lg-8">
            <div class="card shadow-sm mb-3" v-for="row in rows" :key="row.id">
              <div class="card-body d-flex flex-wrap gap-3 align-items-center">
                <img :src="row.product.image" :alt="row.product.name" width="80" height="80" class="rounded object-fit-cover">
                <div class="flex-grow-1">
                  <a class="fw-semibold text-decoration-none text-dark" :href="'urun.html?id=' + row.id">{{ row.product.name }}</a>
                  <div class="small text-muted">{{ money(row.product.price) }} / adet</div>
                  <div class="d-flex align-items-center gap-2 mt-2">
                    <div class="bc-qty">
                      <button type="button" @click="setQty(row.id, row.qty - 1)" aria-label="Azalt">−</button>
                      <span>{{ row.qty }}</span>
                      <button type="button" @click="setQty(row.id, row.qty + 1)" aria-label="Artır">+</button>
                    </div>
                    <button type="button" class="btn btn-link btn-sm text-danger" @click="remove(row.id)">Kaldır</button>
                  </div>
                </div>
                <div class="fw-bold">{{ money(row.line) }}</div>
              </div>
            </div>
            <button type="button" class="btn btn-outline-secondary" @click="clear">Sepeti temizle</button>
          </div>
          <div class="col-lg-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h5">Sipariş özeti</h2>
                <div class="d-flex justify-content-between mb-2"><span>Adet</span><strong>{{ count }}</strong></div>
                <div class="d-flex justify-content-between mb-3"><span>Toplam</span><strong>{{ money(total) }}</strong></div>
                <p class="small text-muted">Demo sepet — ödeme entegrasyonu yok.</p>
                <button type="button" class="btn btn-bc w-100" @click="checkout">Siparişi tamamla</button>
                <a class="btn btn-outline-dark w-100 mt-2" href="urunler.html">Alışverişe devam</a>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
