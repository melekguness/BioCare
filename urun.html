<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ürün Detayı | BioCare</title>
  <!-- Start Bootstrap - Shop Item şablon yapısı -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <main id="icerik" class="py-5">
    <div id="app" class="container px-4 px-lg-5">
      <div v-if="loading" class="text-muted">Yükleniyor…</div>
      <div v-else-if="error" class="alert alert-warning">
        {{ error }}
        <div class="mt-3"><a class="btn btn-outline-dark" href="urunler.html">Listeye dön</a></div>
      </div>

      <template v-else-if="product">
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Ana sayfa</a></li>
            <li class="breadcrumb-item"><a href="urunler.html">Ürünler</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
          </ol>
        </nav>

        <!-- Shop Item: ürün satırı -->
        <div class="row gx-4 gx-lg-5 align-items-center">
          <div class="col-md-6">
            <img class="card-img-top mb-4 mb-md-0 rounded border" :src="product.images[activeImage]" :alt="product.name">
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm p-0 border" v-for="(img, i) in product.images" :key="i"
                :class="{ 'border-dark border-2': activeImage === i }"
                :aria-label="'Görsel ' + (i + 1)" @click="activeImage = i">
                <img :src="img" alt="" width="72" height="72" style="object-fit:cover;display:block">
              </button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="small mb-1 text-muted">{{ catLabel }}</div>
            <h1 class="display-5 fw-bolder">{{ product.name }}</h1>
            <div class="fs-5 mb-3">
              <span class="text-decoration-line-through text-muted me-2" v-if="product.oldPrice">{{ money(product.oldPrice) }}</span>
              <span>{{ money(product.price) }}</span>
            </div>
            <p class="lead">{{ product.short }}</p>
            <p>{{ product.desc }}</p>
            <ul class="list-unstyled small">
              <li v-for="(s, i) in product.specs" :key="i"><i class="bi bi-check2 text-success me-1"></i>{{ s }}</li>
            </ul>
            <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
              <div class="bc-qty" role="group" aria-label="Adet">
                <button type="button" @click="bump(-1)" aria-label="Azalt">−</button>
                <span>{{ qty }}</span>
                <button type="button" @click="bump(1)" aria-label="Artır">+</button>
              </div>
              <button class="btn btn-outline-dark flex-shrink-0" type="button" @click="add">
                <i class="bi-cart-fill me-1"></i>
                Sepete ekle
              </button>
            </div>
          </div>
        </div>

        <section class="py-5" v-if="related.length">
          <h2 class="fw-bolder mb-4">Benzer ürünler</h2>
          <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            <div class="col mb-5" v-for="p in related" :key="p.id">
              <div class="card h-100 shadow-sm">
                <a :href="'urun.html?id=' + p.id">
                  <img class="card-img-top" :src="p.image" :alt="p.name" loading="lazy">
                </a>
                <div class="card-body p-4 text-center">
                  <h5 class="fw-bolder">
                    <a class="text-decoration-none text-dark" :href="'urun.html?id=' + p.id">{{ p.name }}</a>
                  </h5>
                  {{ money(p.price) }}
                </div>
              </div>
            </div>
          </div>
        </section>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
