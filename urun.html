<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ürün | BioCare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <main id="icerik" class="bc-section">
    <div id="app" class="container">
      <div v-if="loading" class="text-secondary">Yükleniyor…</div>
      <div v-else-if="error" class="alert alert-warning">
        {{ error }}
        <div class="mt-3"><a class="btn btn-bc" href="urunler.html">Koleksiyona dön</a></div>
      </div>

      <template v-else-if="product">
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Ana sayfa</a></li>
            <li class="breadcrumb-item"><a href="urunler.html">Koleksiyon</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
          </ol>
        </nav>

        <div class="row g-4 g-lg-5 align-items-start">
          <div class="col-lg-6">
            <img class="bc-detail-img" :src="product.images[activeImage]" :alt="product.name" width="900" height="900">
            <div class="bc-thumbs" role="list">
              <button type="button" role="listitem" v-for="(img, i) in product.images" :key="i"
                :class="{ 'is-active': activeImage === i }"
                :aria-label="'Görsel ' + (i + 1)" @click="activeImage = i">
                <img :src="img" alt="" width="72" height="72">
              </button>
            </div>
          </div>
          <div class="col-lg-6">
            <span class="bc-kicker">{{ catLabel }}</span>
            <h1 class="bc-title">{{ product.name }}</h1>
            <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
              <div class="bc-price fs-4">
                <s v-if="product.oldPrice" class="fs-6">{{ money(product.oldPrice) }}</s>
                {{ money(product.price) }}
              </div>
              <div class="bc-rating"><i class="bi bi-star-fill" aria-hidden="true"></i> {{ product.rating }} · Stok {{ product.stock }}</div>
            </div>
            <p class="bc-lead mb-3">{{ product.short }}</p>
            <p>{{ product.desc }}</p>
            <ul class="list-unstyled bc-spec mt-3">
              <li v-for="(s, i) in product.specs" :key="i"><i class="bi bi-check2 me-2 text-success"></i>{{ s }}</li>
            </ul>
            <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
              <div class="bc-qty" role="group" aria-label="Adet">
                <button type="button" @click="bump(-1)" aria-label="Azalt">−</button>
                <span>{{ qty }}</span>
                <button type="button" @click="bump(1)" aria-label="Artır">+</button>
              </div>
              <button type="button" class="btn btn-bc" @click="add"><i class="bi-bag me-1"></i> Sepete ekle</button>
              <a class="btn btn-bc-line" href="sepet.html">Sepete git</a>
            </div>
          </div>
        </div>

        <section class="mt-5 pt-4" v-if="related.length" aria-labelledby="rel-title">
          <h2 id="rel-title" class="bc-title h3">Benzer ürünler</h2>
          <div class="bc-grid mt-4">
            <article class="bc-product" v-for="p in related" :key="p.id">
              <a class="bc-product__media" :href="'urun.html?id=' + p.id">
                <img :src="p.image" :alt="p.name" loading="lazy">
              </a>
              <h3 class="bc-product__name"><a :href="'urun.html?id=' + p.id">{{ p.name }}</a></h3>
              <div class="bc-price">{{ money(p.price) }}</div>
            </article>
          </div>
        </section>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
