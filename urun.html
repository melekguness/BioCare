<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BioCare ürün detayı">
  <title>Ürün Detayı | BioCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <main id="icerik" class="bc-section">
    <div id="app" class="container">
      <div v-if="loading" class="bc-empty" role="status">Ürün yükleniyor…</div>
      <div v-else-if="error" class="alert alert-warning" role="alert">
        {{ error }}
        <div class="mt-3"><a class="btn btn-bc" href="urunler.html">Ürün listesine dön</a></div>
      </div>
      <template v-else-if="product">
        <nav aria-label="Sayfa yolu" class="mb-3">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Ana sayfa</a></li>
            <li class="breadcrumb-item"><a href="urunler.html">Ürünler</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
          </ol>
        </nav>

        <div class="row g-4 g-lg-5">
          <div class="col-lg-6">
            <div class="bc-detail-media">
              <img
                :src="product.images[activeImage]"
                :alt="product.name"
                width="800"
                height="800">
            </div>
            <div class="bc-thumbs" role="list" aria-label="Ürün görselleri">
              <button
                v-for="(img, i) in product.images"
                :key="i"
                type="button"
                role="listitem"
                :class="{ 'is-active': activeImage === i }"
                :aria-label="'Görsel ' + (i + 1)"
                :aria-pressed="activeImage === i"
                @click="activeImage = i">
                <img :src="img" alt="" width="72" height="72">
              </button>
            </div>
          </div>

          <div class="col-lg-6">
            <p class="bc-kicker mb-2">{{ catLabel }}</p>
            <h1 class="bc-title">{{ product.name }}</h1>
            <p class="bc-lead">{{ product.short }}</p>

            <div class="d-flex flex-wrap align-items-center gap-3 my-3">
              <div class="bc-price fs-3">
                <s v-if="product.oldPrice" class="fs-6 me-2">{{ money(product.oldPrice) }}</s>
                {{ money(product.price) }}
              </div>
              <div class="bc-rating" :aria-label="'Puan ' + product.rating">
                <span>★</span> {{ product.rating }} · Stok: {{ product.stock }}
              </div>
              <span v-if="product.badge" class="badge text-bg-dark rounded-pill">{{ product.badge }}</span>
            </div>

            <p>{{ product.desc }}</p>

            <ul class="bc-spec-list" aria-label="Teknik özellikler">
              <li v-for="(s, i) in product.specs" :key="i">{{ s }}</li>
            </ul>

            <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
              <div class="bc-qty" role="group" aria-label="Adet">
                <button type="button" @click="bump(-1)" aria-label="Adeti azalt">−</button>
                <span aria-live="polite">{{ qty }}</span>
                <button type="button" @click="bump(1)" aria-label="Adeti artır">+</button>
              </div>
              <button type="button" class="btn btn-bc" @click="add">Sepete ekle</button>
              <a class="btn btn-bc-ghost" href="sepet.html">Sepete git</a>
            </div>
          </div>
        </div>

        <section class="mt-5" aria-labelledby="rel-title" v-if="related.length">
          <h2 id="rel-title" class="bc-title h3">Benzer ürünler</h2>
          <div class="bc-grid mt-3">
            <article v-for="p in related" :key="p.id" class="bc-product">
              <a class="bc-product__media" :href="'urun.html?id=' + p.id">
                <img :src="p.image" :alt="p.name" loading="lazy" width="800" height="800">
              </a>
              <div class="bc-product__body">
                <h3 class="bc-product__name"><a :href="'urun.html?id=' + p.id">{{ p.name }}</a></h3>
                <div class="bc-product__meta">
                  <div class="bc-price">{{ money(p.price) }}</div>
                  <div class="bc-rating"><span>★</span> {{ p.rating }}</div>
                </div>
              </div>
            </article>
          </div>
        </section>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
