<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ürünler | BioCare</title>
  <!-- Start Bootstrap - Shop Homepage şablon yapısı -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-4">
      <div class="text-center text-white">
        <h1 class="display-5 fw-bolder">Ürünler</h1>
        <p class="lead fw-normal text-white-50 mb-0">Ara, filtrele, sepete ekle</p>
      </div>
    </div>
  </header>

  <main id="icerik" class="py-5">
    <div id="app" class="container px-4 px-lg-5">
      <div v-if="loading" class="text-muted">Ürünler yükleniyor…</div>
      <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
      <template v-else>
        <div class="card bc-toolbar mb-4 shadow-sm">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-md-5">
                <label class="form-label" for="search">Ara</label>
                <input id="search" v-model="query" type="search" class="form-control" placeholder="Örn. stetoskop, eldiven…">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="sort">Sırala</label>
                <select id="sort" v-model="sort" class="form-select">
                  <option value="popular">Puana göre</option>
                  <option value="price-asc">Fiyat (artan)</option>
                  <option value="price-desc">Fiyat (azalan)</option>
                  <option value="name">İsme göre</option>
                </select>
              </div>
              <div class="col-md-3 text-md-end text-muted small" aria-live="polite">
                {{ filtered.length }} ürün
              </div>
            </div>
            <div class="d-flex flex-wrap gap-2 mt-3" role="group" aria-label="Kategori">
              <button type="button" class="bc-chip" :class="{ 'is-active': category === 'all' }" @click="setCategory('all')">Tümü</button>
              <button type="button" class="bc-chip" v-for="c in categoryCards" :key="c.id"
                :class="{ 'is-active': category === c.id }" @click="setCategory(c.id)">{{ c.name }}</button>
            </div>
          </div>
        </div>

        <div v-if="!filtered.length" class="text-center py-5">
          <p>Bu filtreye uygun ürün yok.</p>
          <button class="btn btn-outline-dark" type="button" @click="query=''; setCategory('all')">Temizle</button>
        </div>

        <div v-else class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
          <div class="col mb-5" v-for="p in filtered" :key="p.id">
            <div class="card h-100 shadow-sm">
              <div class="badge bg-dark text-white position-absolute" style="top:0.5rem;right:0.5rem" v-if="p.badge"
                :class="{ 'bc-sale': /indirim/i.test(p.badge) }">{{ p.badge }}</div>
              <a :href="'urun.html?id=' + p.id">
                <img class="card-img-top" :src="p.image" :alt="p.name" loading="lazy">
              </a>
              <div class="card-body p-4">
                <div class="text-center">
                  <div class="small text-muted mb-1">{{ catName(p.category) }}</div>
                  <h5 class="fw-bolder">
                    <a class="text-decoration-none text-dark" :href="'urun.html?id=' + p.id">{{ p.name }}</a>
                  </h5>
                  <p class="small text-secondary">{{ p.short }}</p>
                  <div class="small mb-2"><i class="bi bi-star-fill text-warning"></i> {{ p.rating }}</div>
                  <span class="text-muted text-decoration-line-through me-1" v-if="p.oldPrice">{{ money(p.oldPrice) }}</span>
                  {{ money(p.price) }}
                </div>
              </div>
              <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                <div class="text-center d-grid gap-2">
                  <button class="btn btn-outline-dark mt-auto" type="button" @click="add(p.id)">Sepete ekle</button>
                  <a class="btn btn-bc btn-sm" :href="'urun.html?id=' + p.id">İncele</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
