<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Koleksiyon | BioCare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <header class="bc-page-banner">
    <div class="container">
      <h1>Koleksiyon</h1>
      <p class="mb-0 text-white-50">Klinik standartlarda seçilmiş ürünler</p>
    </div>
  </header>

  <main id="icerik" class="bc-section">
    <div id="app" class="container">
      <div v-if="loading" class="text-secondary">Yükleniyor…</div>
      <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
      <template v-else>
        <div class="bc-toolbar">
          <div class="row g-3 align-items-end">
            <div class="col-md-5">
              <label class="form-label fw-semibold" for="search">Ara</label>
              <input id="search" v-model="query" type="search" class="form-control" placeholder="Stetoskop, eldiven, TENS…">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold" for="sort">Sırala</label>
              <select id="sort" v-model="sort" class="form-select">
                <option value="popular">Puana göre</option>
                <option value="price-asc">Fiyat (artan)</option>
                <option value="price-desc">Fiyat (azalan)</option>
                <option value="name">İsme göre</option>
              </select>
            </div>
            <div class="col-md-3 text-md-end text-secondary small" aria-live="polite">{{ filtered.length }} ürün</div>
          </div>
          <div class="bc-chips" role="group" aria-label="Kategori">
            <button type="button" class="bc-chip" :class="{ 'is-active': category === 'all' }" @click="setCategory('all')">Tümü</button>
            <button type="button" class="bc-chip" v-for="c in categoryCards" :key="c.id"
              :class="{ 'is-active': category === c.id }" @click="setCategory(c.id)">{{ c.name }}</button>
          </div>
        </div>

        <div v-if="!filtered.length" class="text-center py-5">
          <p class="text-secondary">Sonuç yok.</p>
          <button type="button" class="btn btn-bc-line" @click="query=''; setCategory('all')">Filtreleri temizle</button>
        </div>

        <div v-else class="bc-grid">
          <article class="bc-product" v-for="p in filtered" :key="p.id">
            <a class="bc-product__media" :href="'urun.html?id=' + p.id" :aria-label="p.name">
              <span class="bc-product__badge" v-if="p.badge">{{ p.badge }}</span>
              <img :src="p.image" :alt="p.name" loading="lazy" width="800" height="1000">
            </a>
            <div class="bc-product__cat">{{ catName(p.category) }}</div>
            <h2 class="bc-product__name"><a :href="'urun.html?id=' + p.id">{{ p.name }}</a></h2>
            <p class="small text-secondary mb-2">{{ p.short }}</p>
            <div class="bc-product__meta">
              <div class="bc-price"><s v-if="p.oldPrice">{{ money(p.oldPrice) }}</s>{{ money(p.price) }}</div>
              <div class="bc-rating"><i class="bi bi-star-fill" aria-hidden="true"></i> {{ p.rating }}</div>
            </div>
            <div class="bc-product__actions">
              <button type="button" class="btn btn-bc btn-sm" @click="add(p.id)">Sepete ekle</button>
              <a class="btn btn-bc-line btn-sm" :href="'urun.html?id=' + p.id">İncele</a>
            </div>
          </article>
        </div>
      </template>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
