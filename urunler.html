<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BioCare ürün kataloğu — ara, filtrele, sepete ekle.">
  <title>Ürünler | BioCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#icerik">İçeriğe atla</a>
  <div id="site-header"></div>

  <main id="icerik">
    <div class="container bc-page-hero">
      <h1>Ürünler</h1>
      <p class="bc-lead">Kategori ve arama ile daralt</p>
    </div>

    <div id="app" class="bc-section pt-3">
      <div class="container">
        <div v-if="loading" class="bc-empty" role="status">Ürünler yükleniyor…</div>
        <div v-else-if="error" class="alert alert-danger" role="alert">{{ error }}</div>
        <template v-else>
          <div class="bc-toolbar">
            <div class="row g-3 align-items-end">
              <div class="col-md-5">
                <label class="form-label" for="search">Ara</label>
                <input
                  id="search"
                  v-model="query"
                  type="search"
                  class="form-control"
                  placeholder="Örn. stetoskop, eldiven, TENS…"
                  autocomplete="off">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="sort">Sırala</label>
                <select id="sort" v-model="sort" class="form-select">
                  <option value="popular">Puana göre</option>
                  <option value="price-asc">Fiyat (artan)</option>
                  <option value="price-desc">Fiyat (azalan)</option>
                  <option value="name">İsme göre</option>
                </select>
              </div>
              <div class="col-md-3">
                <p class="bc-result-count mb-0" aria-live="polite">
                  {{ filtered.length }} ürün listeleniyor
                </p>
              </div>
            </div>
            <div class="bc-chip-row mt-3" role="group" aria-label="Kategori filtreleri">
              <button
                type="button"
                class="bc-chip"
                :class="{ 'is-active': category === 'all' }"
                :aria-pressed="category === 'all'"
                @click="setCategory('all')">
                Tümü
              </button>
              <button
                v-for="c in categoryCards"
                :key="c.id"
                type="button"
                class="bc-chip"
                :class="{ 'is-active': category === c.id }"
                :aria-pressed="category === c.id"
                @click="setCategory(c.id)">
                {{ c.name }}
              </button>
            </div>
          </div>

          <div v-if="!filtered.length" class="bc-empty">
            <p class="mb-2">Bu filtreye uygun ürün yok.</p>
            <button type="button" class="btn btn-bc-ghost" @click="query=''; setCategory('all')">Filtreleri temizle</button>
          </div>

          <div v-else class="bc-grid" aria-live="polite">
            <article v-for="p in filtered" :key="p.id" class="bc-product">
              <a class="bc-product__media" :href="'urun.html?id=' + p.id" :aria-label="p.name + ' detayı'">
                <span v-if="p.badge" class="bc-product__badge" :class="{ 'is-sale': /indirim/i.test(p.badge) }">{{ p.badge }}</span>
                <img :src="p.image" :alt="p.name" loading="lazy" width="800" height="800">
              </a>
              <div class="bc-product__body">
                <div class="bc-product__cat">{{ catName(p.category) }}</div>
                <h2 class="bc-product__name"><a :href="'urun.html?id=' + p.id">{{ p.name }}</a></h2>
                <p class="small text-secondary mb-0">{{ p.short }}</p>
                <div class="bc-product__meta">
                  <div class="bc-price">
                    <s v-if="p.oldPrice">{{ money(p.oldPrice) }}</s>{{ money(p.price) }}
                  </div>
                  <div class="bc-rating" :aria-label="'Puan ' + p.rating"><span>★</span> {{ p.rating }}</div>
                </div>
                <div class="bc-product__actions">
                  <button type="button" class="btn btn-bc btn-sm" @click="add(p.id)">Sepete ekle</button>
                  <a class="btn btn-bc-ghost btn-sm" :href="'urun.html?id=' + p.id">İncele</a>
                </div>
              </div>
            </article>
          </div>
        </template>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
